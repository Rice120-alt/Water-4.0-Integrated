; Water 4.0 shared economy policy
; Restart the game after editing this file. Runtime hot reload is intentionally disabled.
; The Water Broker and regular-vendor scaler both load and validate this exact file.

[Water4]
SchemaVersion=2
PolicyRevision=1
; Intervals that divide 24 hours use local wall-clock boundaries. The default
; 7200 rotates at midnight, 2 AM, 4 AM, ... and never restarts on game boot.
BrokerRefreshSeconds=7200

[Modules]
WaterBrokerEnabled=true
RegularVendorScalingEnabled=true

; RequiredCategories is a comma-separated slot recipe. Repeating a category
; reserves more than one slot for it. Supported values are:
; medical, ammo, provisions, resource, contraband, utility, weapon
;
; QualityBonusPercent favors more valuable offers inside each category without
; changing prices, quantities, stock caps, or the required category recipe.

[Band.scarce]
Order=1
Label=Scarce
MinWater=0
MaxWater=20
VendorStockMultiplier=0.50
VendorStockRounding=ceil
BrokerOfferCount=4
RequiredCategories=medical,ammo,provisions,resource
AllowWeapons=false
AllowSpecialItems=false
QualityBonusPercent=0
UseExactCatalogStockCaps=false

[Band.recovering]
Order=2
Label=Recovering
MinWater=21
MaxWater=40
VendorStockMultiplier=0.80
VendorStockRounding=ceil
BrokerOfferCount=5
RequiredCategories=medical,ammo,provisions,resource,utility
AllowWeapons=false
AllowSpecialItems=false
QualityBonusPercent=10
UseExactCatalogStockCaps=false

[Band.stable]
Order=3
Label=Stable
MinWater=41
MaxWater=65
VendorStockMultiplier=1.00
VendorStockRounding=nearest
BrokerOfferCount=6
RequiredCategories=medical,ammo,provisions,resource,contraband,utility
AllowWeapons=false
AllowSpecialItems=false
QualityBonusPercent=25
UseExactCatalogStockCaps=false

[Band.abundant]
Order=4
Label=Abundant
MinWater=66
MaxWater=unbounded
VendorStockMultiplier=1.25
VendorStockRounding=floor
BrokerOfferCount=8
RequiredCategories=medical,ammo,ammo,provisions,resource,contraband,utility,weapon
AllowWeapons=true
AllowSpecialItems=true
QualityBonusPercent=50
UseExactCatalogStockCaps=true

; Water Broker offer catalog (52 current-build supported offers)
;
; Safe to edit: Enabled, DisplayName, Category, WaterCost,
; QuantityPerTrade, MaxTradesPerRotation, MaxPurchaseUnits, and AllowedBands.
; Restart the game after every change and increment PolicyRevision.
;
; GameId and InventoryKind are protected identity fields. They are listed so
; the exact game row is visible, but changing either rejects the whole Broker
; catalog before the overlay or any native transaction route starts.
;
; MaxTradesPerRotation is the exact cap used by bands with
; UseExactCatalogStockCaps=true. Other bands derive stock from that cap and
; their multiplier/rounding rule. MaxPurchaseUnits limits one confirmation.
;
; AllowedBands=all permits the offer in every band subject to the band's
; AllowWeapons/AllowSpecialItems rules. Otherwise use comma-separated band IDs.
; Disabling/reclassifying too many offers to fill a band's RequiredCategories
; rejects the catalog rather than silently producing an incomplete shop.

